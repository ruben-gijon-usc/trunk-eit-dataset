<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Monte Carlo - Tronco e Impurezas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            background-color: #f4f6f9;
            color: #2c3e50;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .controls-container {
            flex: 1;
            min-width: 350px;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e1e8ed;
        }
        .panel h3 {
            margin-top: 0;
            color: #34495e;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }
        .canvas-container {
            flex: 2;
            min-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 20px;
            border: 1px solid #e1e8ed;
        }
        canvas {
            background: #fff;
            border-radius: 50%;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.03);
        }
        .form-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .form-group input {
            width: 60px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        #log {
            margin-top: 15px;
            font-family: monospace;
            font-size: 0.85em;
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="controls-container">
        <div class="panel">
            <h3>Generador Monte Carlo</h3>
            <p style="font-size: 0.9em; color: #7f8c8d;">
                Utiliza muestreo de rechazo para generar anomalías orgánicas (Fourier) que no se auto-intersecten ni salgan del tronco.
            </p>
            <div class="form-group">
                <label for="num_anomalies"><b>Cantidad de impurezas:</b></label>
                <input type="number" id="num_anomalies" min="1" max="50" value="5">
            </div>
            <button onclick="generateTrunk()">Generar Tronco Aleatorio</button>
        </div>
        
        <div id="log">Esperando generación...</div>
    </div>

    <div class="canvas-container">
        <canvas id="canvas" width="600" height="600"></canvas>
    </div>

    <script>
        const TRUNK_RADIUS = 0.8; // Metros
        const SCALE = 300;        // Píxeles por metro

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        let anomalies = [];

        // --- Utilidades Matemáticas ---

        // Transformada de Box-Muller para generar números con distribución Normal (Gaussiana)
        function randomGauss(mean = 0, stdDev = 1) {
            let u1 = 1.0 - Math.random(); 
            let u2 = 1.0 - Math.random(); 
            let randStdNormal = Math.sqrt(-2.0 * Math.log(u1)) * Math.sin(2.0 * Math.PI * u2);
            return mean + stdDev * randStdNormal;
        }

        // --- Lógica de Monte Carlo (Muestreo de Rechazo) ---

        function isValid(imp) {
            const steps = 100;
            // Centro de la anomalía relativo al centro del tronco (0,0)
            const cx = imp.pos_r * Math.cos(imp.pos_phi);
            const cy = imp.pos_r * Math.sin(imp.pos_phi);

            for (let i = 0; i <= steps; i++) {
                const theta = (i / steps) * 2 * Math.PI;
                
                // Calcular radio r(theta)
                let r = imp.r0;
                r += imp.a1 * Math.cos(theta) + imp.b1 * Math.sin(theta);
                r += imp.a2 * Math.cos(2 * theta) + imp.b2 * Math.sin(2 * theta);
                r += imp.a3 * Math.cos(3 * theta) + imp.b3 * Math.sin(3 * theta);
                r += imp.a4 * Math.cos(4 * theta) + imp.b4 * Math.sin(4 * theta);

                // Regla 1: No auto-intersección (Damos 0.01m de margen)
                if (r <= 0.01) return false;

                // Regla 2: Dentro del tronco
                const px = cx + r * Math.cos(theta);
                const py = cy + r * Math.sin(theta);
                const distToCenter = Math.hypot(px, py); // Distancia real al centro del tronco

                if (distToCenter > TRUNK_RADIUS) return false;
            }
            return true;
        }

        function generateAnomaly() {
            let attempts = 0;
            const maxAttempts = 2000;

            while (attempts < maxAttempts) {
                attempts++;
                
                // 1. Posición (Distribución por área: raíz cuadrada del random)
                let pos_r = TRUNK_RADIUS * Math.sqrt(Math.random());
                let pos_phi = Math.random() * 2 * Math.PI;

                // 2. Radio Base (Normal, centrado en 15% del radio del tronco)
                let r0 = Math.max(0.02, randomGauss(TRUNK_RADIUS * 0.15, 0.05));

                // 3. Armónicos (Varianza decayente según la frecuencia k)
                let a1 = randomGauss(0, (r0 * 0.2) / 1);
                let b1 = randomGauss(0, (r0 * 0.2) / 1);
                
                let a2 = randomGauss(0, (r0 * 0.2) / 2);
                let b2 = randomGauss(0, (r0 * 0.2) / 2);
                
                let a3 = randomGauss(0, (r0 * 0.2) / 3);
                let b3 = randomGauss(0, (r0 * 0.2) / 3);
                
                let a4 = randomGauss(0, (r0 * 0.2) / 4);
                let b4 = randomGauss(0, (r0 * 0.2) / 4);

                let candidate = { pos_r, pos_phi, r0, a1, b1, a2, b2, a3, b3, a4, b4, attempts };

                // Evaluamos si cumple la física
                if (isValid(candidate)) {
                    // Asignar color aleatorio oscuro para contraste
                    const hue = Math.floor(Math.random() * 360);
                    candidate.color = `hsla(${hue}, 60%, 40%, 0.75)`;
                    candidate.stroke = `hsla(${hue}, 70%, 25%, 1)`;
                    return candidate;
                }
            }
            console.error("Fallo al generar anomalía tras " + maxAttempts + " intentos.");
            return null;
        }

        // --- Controladores y Dibujado ---

        function generateTrunk() {
            const count = parseInt(document.getElementById('num_anomalies').value) || 0;
            anomalies = [];
            const logEl = document.getElementById('log');
            logEl.innerHTML = "Generando...\n";

            let totalAttempts = 0;
            
            for (let i = 0; i < count; i++) {
                const imp = generateAnomaly();
                if (imp) {
                    anomalies.push(imp);
                    totalAttempts += imp.attempts;
                    logEl.innerHTML += `[Impureza ${i+1}] Aceptada tras ${imp.attempts} iteraciones de rechazo.\n`;
                    logEl.innerHTML += `  r: ${imp.pos_r.toFixed(2)}m, φ: ${(imp.pos_phi * 180 / Math.PI).toFixed(0)}°, R₀: ${imp.r0.toFixed(3)}m\n`;
                }
            }
            
            logEl.innerHTML += `\nGeneración completada. Intentos totales M-C: ${totalAttempts}`;
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Dibujar Tronco
            ctx.fillStyle = '#fdf3e7';
            ctx.strokeStyle = '#d4ac7f';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(centerX, centerY, TRUNK_RADIUS * SCALE, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();

            // Referencias
            ctx.strokeStyle = '#e1e8ed';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, centerY); ctx.lineTo(canvas.width, centerY);
            ctx.moveTo(centerX, 0); ctx.lineTo(centerX, canvas.height);
            ctx.stroke();
            ctx.fillStyle = '#95a5a6';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 3, 0, 2 * Math.PI);
            ctx.fill();

            // 2. Dibujar Impurezas
            anomalies.forEach(imp => {
                const cx_canvas = centerX + imp.pos_r * SCALE * Math.cos(imp.pos_phi);
                const cy_canvas = centerY + imp.pos_r * SCALE * Math.sin(imp.pos_phi);

                const points = [];
                const steps = 200;

                for (let i = 0; i <= steps; i++) {
                    const theta = (i / steps) * 2 * Math.PI;
                    
                    let r = imp.r0;
                    r += imp.a1 * Math.cos(theta) + imp.b1 * Math.sin(theta);
                    r += imp.a2 * Math.cos(2 * theta) + imp.b2 * Math.sin(2 * theta);
                    r += imp.a3 * Math.cos(3 * theta) + imp.b3 * Math.sin(3 * theta);
                    r += imp.a4 * Math.cos(4 * theta) + imp.b4 * Math.sin(4 * theta);

                    const px = cx_canvas + r * SCALE * Math.cos(theta);
                    const py = cy_canvas + r * SCALE * Math.sin(theta);
                    points.push({x: px, y: py});
                }

                ctx.fillStyle = imp.color;
                ctx.strokeStyle = imp.stroke;
                ctx.lineWidth = 2;
                
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Centro de la impureza
                ctx.fillStyle = imp.stroke;
                ctx.beginPath();
                ctx.arc(cx_canvas, cy_canvas, 2, 0, 2 * Math.PI);
                ctx.fill();
            });
        }

        // Generar uno por defecto al cargar
        generateTrunk();
    </script>
</body>
</html>
