[project]
name = "trunk-eit-dataset"
version = "0.1.0"
description = "ML dataset generation for EIT applied to tree trunks"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[tool.ruff]
# Target Python version
target-version = "py310"
# Line length (88 is the Black standard, but some prefer 100 or 120)
line-length = 100

[tool.ruff.lint]
# Enable specific rule sets
# E/W = pycodestyle, F = Pyflakes, I = isort, B = flake8-bugbear
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = []

[tool.ruff.format]
# Enable the Ruff formatter (replaces Black)
quote-style = "double"
indent-style = "space"